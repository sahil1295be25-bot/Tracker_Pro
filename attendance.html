<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">Tracker Pro</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="tools.html">Tools</a></li>
            <li><a href="about.html">About Me</a></li>
        </ul>
    </nav>
    <header>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h1>Attendance Tracker</h1>
    </header>

    <main class="container">


        <div class="glass-card">
            <h2>Mark Attendance</h2>
            <form id="attendance-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject / Activity</label>
                    <input type="text" id="subject" placeholder="e.g., Mathematics, Team Meeting" required>
                </div>
                <div class="form-group" style="display: flex; flex-direction: row; gap: 1rem;">
                    <div style="flex: 1;">
                        <label for="delivered">Classes Delivered</label>
                        <input type="number" id="delivered" min="1" required style="margin-top: 0.5rem;">
                    </div>
                    <div style="flex: 1;">
                        <label for="attended">Classes Attended</label>
                        <input type="number" id="attended" min="0" required style="margin-top: 0.5rem;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Add Record</button>
                <div id="live-percentage" style="text-align: center; margin-top: 1rem; font-weight: 600; font-size: 1.1rem; min-height: 1.5rem;"></div>
            </form>
        </div>

        <div class="glass-card">
            <h2>History</h2>
            <div class="record-list" id="attendance-list">
                <!-- Records will be injected here via JS -->
            </div>
        </div>
    </main>

    <script src="attendance.js"></script>
</body>
</html>
