<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">Tracker Pro</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="tools.html">Tools</a></li>
            <li><a href="about.html">About Me</a></li>
        </ul>
    </nav>
    <header>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h1>Expense Tracker</h1>
    </header>

    <main class="container">
        <div class="stats-container" style="grid-template-columns: 1fr;">
            <div class="stat-box">
                <div class="stat-label">Total Balance</div>
                <div class="stat-value" id="total-balance">$0.00</div>
            </div>
        </div>
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">Total Income</div>
                <div class="stat-value" id="total-income" style="color: var(--success)">$0.00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Expense</div>
                <div class="stat-value" id="total-expense" style="color: var(--danger)">$0.00</div>
            </div>
        </div>

        <div class="glass-card">
            <h2>Add Transaction</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Groceries, Salary" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" placeholder="e.g., 50.00" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="Expense">Expense</option>
                        <option value="Income">Income</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Add Transaction</button>
            </form>
        </div>

        <div class="glass-card">
            <h2>Transaction History</h2>
            <div class="record-list" id="expense-list">
                <!-- Records will be injected here via JS -->
            </div>
        </div>
    </main>

    <script src="expense.js"></script>
</body>
</html>
